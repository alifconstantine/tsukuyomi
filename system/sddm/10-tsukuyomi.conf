[General]
DisplayServer=wayland
GreeterEnvironment=QT_QPA_PLATFORM=wayland,XCURSOR_THEME=Bibata-Modern-Classic,XCURSOR_SIZE=24,QML_XHR_ALLOW_FILE_READ=1

[Wayland]
CompositorCommand=/usr/local/bin/tsukuyomi-greeter
SessionCommand=/usr/local/bin/tsukuyomi-wayland-session

[Theme]
Current=tsukuyomi
CursorTheme=Bibata-Modern-Classic
CursorSize=24

[Users]
MaximumUid=60000
MinimumUid=1000
RememberLastSession=true
RememberLastUser=true
