# Deployed to /etc/mkinitcpio.conf.d/tsukuyomi.conf on the installed system.
# 'kms' and 'keyboard' precede 'plymouth' so DRM and input are initialized
# before Plymouth starts; 'plymouth' precedes 'encrypt' for graphical LUKS unlock;
# 'btrfs-overlayfs' enables booting read-only Snapper snapshots from Limine.
HOOKS=(base udev autodetect microcode modconf kms keyboard keymap consolefont plymouth block encrypt filesystems btrfs-overlayfs fsck)
