# Tsukuyomi OS Limine configuration -> /boot/limine.conf (ESP root)
# Text-only minimalist obsidian & crimson palette modeled on Ryoku.

timeout: 3
default_entry: 1
remember_last_entry: yes

interface_branding: Tsukuyomi Bootloader
interface_branding_color: C92A2A
interface_help_color: C92A2A
hash_mismatch_panic: no

term_background: 060607
backdrop: 060607

# Palette: black, bone, crimson, dim-red, sage, crimson, stone, bone
term_palette: 060607;EAE2D5;C92A2A;3A2B2B;7FA67D;C92A2A;8C857A;EAE2D5
term_palette_bright: 141010;EAE2D5;C92A2A;3A2B2B;7FA67D;C92A2A;8C857A;EAE2D5

term_foreground: EAE2D5
term_foreground_bright: EAE2D5
term_background_bright: 141010

/Tsukuyomi OS
    protocol: efi
    path: boot():/EFI/Linux/tsukuyomi_linux.efi
