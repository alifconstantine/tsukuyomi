# Deployed to /etc/default/limine for limine-mkinitcpio-hook / limine-snapper-sync.
TARGET_OS_NAME="Tsukuyomi OS"
ESP_PATH="/boot"

# @@CMDLINE@@ is replaced by the installer with the target root/LUKS cmdline.
KERNEL_CMDLINE[default]+="@@CMDLINE@@"
KERNEL_CMDLINE[default]+=" quiet splash plymouth.ignore-serial-consoles loglevel=0 systemd.show_status=false rd.udev.log_level=0 vt.global_cursor_default=0 initramfs_async=0"

ENABLE_UKI=yes
CUSTOM_UKI_NAME="tsukuyomi"
ENABLE_LIMINE_FALLBACK=yes
FIND_BOOTLOADERS=yes
BOOT_ORDER="*, *fallback, Snapshots"
MAX_SNAPSHOT_ENTRIES=10
SNAPSHOT_FORMAT_CHOICE=5
