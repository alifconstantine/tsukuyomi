# Loopback boot entry for Ventoy GRUB2 mode and Super Grub Disk.
search --no-floppy --set=archiso_img_dev --file "${iso_path}"
probe --set archiso_img_dev_uuid --fs-uuid "${archiso_img_dev}"

default=tsukuyomi
timeout=10
timeout_style=menu

menuentry "Tsukuyomi OS Live Installer (%ARCH%)" --class arch --class gnu-linux --class gnu --class os --id 'tsukuyomi' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" cow_spacesize=2G quiet loglevel=3 console=ttyS0,115200 console=tty0
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
}

menuentry "Tsukuyomi OS Live Installer (%ARCH%, Safe Graphics)" --class arch --class gnu-linux --class gnu --class os --id 'tsukuyomi-nomodeset' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" cow_spacesize=2G quiet loglevel=3 nomodeset console=ttyS0,115200 console=tty0
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
}
