title    Tsukuyomi OS Live Installer (%ARCH%, Copy to RAM)
sort-key 03
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=2G copytoram=y quiet loglevel=3 nvme_load=yes console=ttyS0,115200 console=tty0
