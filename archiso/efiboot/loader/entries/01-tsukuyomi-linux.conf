title    Tsukuyomi OS Live Installer (%ARCH%, UEFI)
sort-key 01
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=2G quiet loglevel=3 i915.modeset=1 amdgpu.modeset=1 nvme_load=yes console=ttyS0,115200 console=tty0
