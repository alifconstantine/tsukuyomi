LABEL tsukuyomi
TEXT HELP
Boot the Tsukuyomi OS Live Installer (CachyOS + Hyprland + Ryoku).
ENDTEXT
MENU LABEL Tsukuyomi OS Live Installer (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=2G quiet splash plymouth.ignore-serial-consoles loglevel=0 systemd.show_status=false rd.udev.log_level=0 vt.global_cursor_default=0 i915.modeset=1 amdgpu.modeset=1 nvme_load=yes

LABEL tsukuyomi_nomodeset
TEXT HELP
Boot the Tsukuyomi OS Live Installer in safe graphics (nomodeset) mode.
ENDTEXT
MENU LABEL Tsukuyomi OS Safe Graphics (nomodeset, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=2G quiet splash plymouth.ignore-serial-consoles loglevel=3 module_blacklist=nvidia,nvidia_modeset,nvidia_uvm,nvidia_drm nomodeset nvme_load=yes
